<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mariana & Ryan · Guatapé 2028</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--paper:#fffdf9;--ink:#1d2f45;--blue:#4f78a0;--b2:#a9c1d6;--wash:#e4edf4;--sage:#9bb59a;--cc:#7a4a32;--line:#ddd3c2;--mute:#5b6b7b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 18px/1.8 Jost,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=es] [data-en],html[lang=es] [data-pt],html[lang=en] [data-es],html[lang=en] [data-pt],html[lang=pt] [data-es],html[lang=pt] [data-en]{display:none}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.15}
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:rgba(250,246,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
nav div{display:flex;gap:16px;overflow-x:auto;white-space:nowrap}
nav a{color:var(--ink);text-decoration:none}
nav button,.lb button{background:none;border:1px solid var(--blue);color:var(--blue);padding:5px 11px;font:inherit;cursor:pointer;letter-spacing:.14em}
nav button.active-audio,.lb button.on{background:var(--blue);color:#fff}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--b2),var(--cc));z-index:60}
#en{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at 20% 15%,#bcd3e5,transparent 60%),radial-gradient(ellipse at 85% 90%,#d9c3b2,transparent 55%),var(--wash);transition:opacity .6s ease}
#en.out{opacity:0;pointer-events:none}
#en .mono{font-size:clamp(84px,22vw,160px)}
#en p{font:italic 400 24px 'Cormorant Garamond',serif;margin:0 0 24px}
.lb{display:flex;gap:8px;margin-bottom:22px}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:14px 30px;border:0;font:400 12px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.hero{min-height:84vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;background:radial-gradient(ellipse at 15% 15%,rgba(169,193,214,.45),transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(155,181,154,.35),transparent 55%),var(--wash)}
.mono{font:400 clamp(70px,17vw,130px)/1 'Pinyon Script',cursive;color:var(--blue)}
.hero h1{font-size:clamp(30px,7vw,58px);letter-spacing:.28em;font-weight:400;margin:8px 0}
.hero .d{letter-spacing:.35em;font-size:15px}
.hero .cd{margin-top:14px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue)}
section{max-width:860px;margin:0 auto;padding:74px 24px}
.alt{max-width:none;background:radial-gradient(ellipse at 100% 0,rgba(242,201,180,.35),transparent 45%),radial-gradient(ellipse at 0 100%,rgba(227,209,162,.4),transparent 45%),var(--wash)}
.alt>div{max-width:860px;margin:0 auto}
h2{font-size:clamp(34px,6vw,50px);text-align:center;font-weight:400}
.sub{text-align:center;color:var(--blue);margin:10px 0 34px;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
p{margin:0 0 18px}
.q{text-align:center;font:italic 400 26px/1.45 'Cormorant Garamond',serif;color:var(--blue);max-width:620px;margin:28px auto}
.tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.tabs{display:flex;justify-content:center;gap:32px;margin-bottom:14px;flex-wrap:wrap}
.tb{border-radius:50%;width:104px;height:104px;border:1px solid var(--line);background:var(--paper);font:italic 400 46px/1 'Cormorant Garamond',serif;color:var(--blue);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tb small{display:block;font:400 10px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.tb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pn{display:none;text-align:center;max-width:580px;margin:24px auto 0;background:var(--paper);border:1px solid var(--line);padding:28px 24px}
.pn.on{display:block}
.pn h3{font-size:38px;margin:8px 0 12px}
.pn .big{font:500 28px 'Cormorant Garamond',serif;color:var(--cc);margin-bottom:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.card{background:var(--paper);border:1px solid var(--line);padding:24px}
.card h3{font-size:28px;margin:6px 0 12px}
.card p{font-size:16px;margin-bottom:14px}
.ph{aspect-ratio:16/9;background:var(--wash);overflow:hidden;margin:-24px -24px 20px}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
a.t{color:var(--blue);letter-spacing:.12em;font-size:13px;text-decoration:none;font-weight:500}

/* Para tener presente: diseño por cuadro + contraste legible */
.fls{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:12px}
.note-card{border-radius:10px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;border:1px solid rgba(29,47,69,.14);box-shadow:0 10px 24px rgba(29,47,69,.08)}
.note-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.note-num{font:italic 600 34px/1 'Cormorant Garamond',serif}
.note-badge{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-weight:500}
.note-card h3{font-size:30px;line-height:1.15}
.note-sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.note-body{font-size:15.5px;line-height:1.65;margin:0}

/* Cuadro 01: Clima (cielo azul embalse y calidez solar) */
.note-clima{background:linear-gradient(165deg,#eef5fa 0%,#dcebf5 100%);color:#16283b;border-color:#b8d0e4}
.note-clima .note-num{color:#2f5d85}
.note-clima .note-badge{background:#ffffff;color:#2f5d85;border:1px solid #b8d0e4}
.note-clima .note-sub{color:#3c6382}

/* Cuadro 02: Cómo vestir (verde bosque/salvia y calma campestre) */
.note-vestir{background:linear-gradient(165deg,#eff4ee 0%,#dce8da 100%);color:#1b2c22;border-color:#b7ccb4}
.note-vestir .note-num{color:#3d6349}
.note-vestir .note-badge{background:#ffffff;color:#3d6349;border:1px solid #b7ccb4}
.note-vestir .note-sub{color:#486952}

/* Cuadro 03: Colores (contraste oscuro legible sobre tono arena cálido) */
.note-colores{background:linear-gradient(165deg,#f7efe3 0%,#eadac2 100%);color:#261b14;border-color:#d2be9f}
.note-colores .note-num{color:#7a4a32}
.note-colores .note-badge{background:#ffffff;color:#7a4a32;border:1px solid #d2be9f}
.note-colores .note-sub{color:#6b4632}

.pal{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pal i{width:24px;height:32px;border-radius:0 100% 0 100%;display:block;transform:rotate(-8deg);border:1px solid rgba(29,47,69,.28)}

/* Guatapé para explorar */
.xp{display:grid;grid-template-columns:1fr 1.25fr;gap:30px;align-items:start}
.xi{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);font:500 26px 'Cormorant Garamond',serif;padding:14px 18px;color:var(--ink);cursor:pointer;margin-bottom:10px}
.xi.on{color:#fff;border-color:var(--blue);background:var(--blue)}
#xd{min-height:360px;padding:28px;border:1px solid var(--line);border-radius:10px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;background-color:#182b3a;color:#fff;overflow:hidden;isolation:isolate}
#xd:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,24,36,.92) 0%,rgba(12,24,36,.42) 55%,rgba(12,24,36,.12) 100%);z-index:-1}
#xd em{position:absolute;top:14px;left:22px;font:italic 400 64px/1 'Cormorant Garamond',serif;color:#fff;opacity:.85;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#xd h3,#xd p{color:#fff;margin:6px 0 0;text-shadow:0 1px 6px rgba(0,0,0,.55)}
#xd h3{font-size:34px}
#xd p{font-size:16px;line-height:1.6}
#xd .tag{color:#e4edf4;font-weight:500}
@media(max-width:760px){.fls{grid-template-columns:1fr}}
@media(max-width:640px){.xp{grid-template-columns:1fr}}

details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;font:500 23px 'Cormorant Garamond',serif;list-style:none}
details p{margin:10px 0 0;font-size:16px;color:var(--mute)}

/* Momentos */
.mo{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:28px 0 10px}
