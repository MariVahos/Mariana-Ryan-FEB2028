<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mariana & Ryan · Guatapé 2028</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--paper:#fffdf9;--ink:#1d2f45;--blue:#4f78a0;--b2:#a9c1d6;--wash:#e4edf4;--sage:#9bb59a;--cc:#7a4a32;--line:#ddd3c2;--mute:#5b6b7b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202d;--paper:#1b2a3a;--ink:#f1ece2;--blue:#8fb4d6;--wash:#1e3345;--line:#2f4357;--mute:#a9b8c6;--cc:#d9a98a}}
:root[data-theme="dark"]{--bg:#14202d;--paper:#1b2a3a;--ink:#f1ece2;--blue:#8fb4d6;--wash:#1e3345;--line:#2f4357;--mute:#a9b8c6;--cc:#d9a98a}
*{box-sizing:border-box}html{scroll-behavior:smooth}html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:300 18px/1.8 Jost,system-ui,sans-serif}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
html[lang=es] [data-en],html[lang=es] [data-pt],html[lang=en] [data-es],html[lang=en] [data-pt],html[lang=pt] [data-es],html[lang=pt] [data-en]{display:none}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.15}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
nav div{display:flex;gap:18px;overflow-x:auto;white-space:nowrap}nav a{color:var(--ink);text-decoration:none}
nav button,.lb button{background:none;border:1px solid var(--blue);color:var(--blue);padding:5px 12px;font:inherit;cursor:pointer;letter-spacing:.15em}
nav button.active-audio{background:var(--blue);color:#fff}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--b2),var(--cc));z-index:60}
#en{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at 20% 15%,#bcd3e5,transparent 60%),radial-gradient(ellipse at 85% 90%,#d9c3b2,transparent 55%),var(--wash);transition:opacity 1.2s,transform 1.2s}
#en.out{opacity:0;transform:scale(1.06);pointer-events:none}
#en .mono{font-size:clamp(90px,24vw,170px)}#en p{font:italic 400 24px 'Cormorant Garamond';margin:0 0 28px}
.lb{display:flex;gap:8px;margin-bottom:26px}.lb button.on{background:var(--blue);color:#fff}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:14px 32px;border:0;font:400 12px Jost;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .3s}.btn:hover{transform:translateY(-2px)}
.art{position:absolute;inset:-5% 0;width:100%;height:110%;filter:url(#wc);pointer-events:none;will-change:transform}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}.sw.b{animation-duration:9s;animation-delay:-3s}
.bl{transform-box:fill-box;transform-origin:center;animation:bloom 3.5s ease-out both}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}@keyframes bloom{from{transform:scale(.4);opacity:0}to{transform:scale(1)}}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.hero{position:relative;min-height:94vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;overflow:hidden;background:var(--wash)}
.hero>*:not(svg){position:relative}
.mono{font:400 clamp(70px,17vw,130px)/1 'Pinyon Script',cursive;color:var(--blue)}
.hero h1{font-size:clamp(30px,7vw,58px);letter-spacing:.3em;font-weight:400;margin:6px 0;text-indent:.3em}
.hero .d{letter-spacing:.4em;font-size:15px;text-indent:.4em}.hero .l{margin-top:28px;font:italic 400 24px 'Cormorant Garamond'}
.hero .cd{margin-top:8px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue)}
section{position:relative;max-width:800px;margin:0 auto;padding:90px 24px}
.alt{max-width:none;background:radial-gradient(ellipse at 100% 0,#f2c9b455,transparent 45%),radial-gradient(ellipse at 0 100%,#e3d1a266,transparent 45%),var(--wash)}.alt>div{max-width:752px;margin:0 auto}
h2{font-size:clamp(34px,6vw,50px);text-align:center;font-weight:400}
.sub{text-align:center;color:var(--blue);margin:10px 0 36px;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.dv{display:block;width:170px;height:22px;margin:0 auto 20px;filter:url(#wc)}
p{margin:0 0 18px}
.q{text-align:center;font:italic 400 27px/1.4 'Cormorant Garamond',serif;color:var(--blue);max-width:600px;margin:30px auto}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s}.js .rv.in{opacity:1;transform:none}
.tag{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--blue)}
.tabs{display:flex;justify-content:center;gap:40px;margin-bottom:10px}
.tb{background:none;border:0;border-bottom:2px solid transparent;font:italic 400 76px/1 'Cormorant Garamond';color:var(--b2);cursor:pointer;padding:0 6px 6px;transition:.4s}.tb small{display:block;font:400 11px Jost;letter-spacing:.25em;text-transform:uppercase;margin-top:6px}
.tb.on{color:var(--blue);border-color:var(--blue)}
.pn{display:none;text-align:center;max-width:560px;margin:30px auto 0}.pn.on{display:block;animation:fi .7s}
.pn h3{font-size:40px;margin:8px 0 14px}.pn .big{font:500 32px 'Cormorant Garamond';color:var(--cc);margin-bottom:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--line);padding:30px 26px;background-image:radial-gradient(ellipse at 0 0,#a9c1d655,transparent 60%);transition:transform .5s,box-shadow .5s}.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px #1d2f4518}
.card h3{font-size:28px;margin:6px 0 12px}.card p{font-size:16px;margin-bottom:12px}
.ph{aspect-ratio:16/9;background:radial-gradient(ellipse at 30% 30%,var(--b2),var(--wash));overflow:hidden;margin:-30px -26px 22px}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .ph img{transform:scale(1.04)}
a.t{color:var(--blue);letter-spacing:.12em;font-size:13px}

/* Para tener presente: claridad de lectura + figuras alusivas */
.fls{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:12px}
.note-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:24px 22px 26px;box-shadow:0 10px 26px #1d2f4512;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.note-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--b2),var(--blue))}
.note-card:nth-child(2)::before{background:linear-gradient(90deg,var(--sage),var(--blue))}
.note-card:nth-child(3)::before{background:linear-gradient(90deg,#d8c3a0,var(--cc))}
.note-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note-num{font:italic 500 34px/1 'Cormorant Garamond',serif;color:var(--blue)}
.note-fig{width:54px;height:54px;flex-shrink:0;filter:url(#wc)}
.note-card h3{font-size:29px;line-height:1.15;color:var(--ink)}
.note-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:-6px}
.note-body{font-size:15.5px;line-height:1.68;color:var(--ink);margin:0}
.pal{display:flex;gap:10px;margin-top:6px;align-items:center}
.pal i{width:20px;height:28px;border-radius:0 100% 0 100%;display:block;transform:rotate(-10deg);border:1px solid #0001}
.sp{position:absolute;top:-6px;width:72px;pointer-events:none;filter:url(#wc);opacity:.9}.sp.l{left:10px}.sp.r{right:10px}

.xp{display:grid;grid-template-columns:1fr 1.25fr;gap:34px;align-items:start}
.xi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);font:500 28px 'Cormorant Garamond';padding:14px 0;color:var(--mute);cursor:pointer;transition:.4s}
.xi.on{color:var(--ink);padding-left:16px;border-color:var(--blue)}
.xi:after{content:" ↗";font:14px Jost;color:var(--blue)}
#xd{min-height:330px;padding:30px;border:1px solid var(--line);position:relative;transition:background-image .6s ease;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;color:#fff;overflow:hidden;isolation:isolate}
#xd:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,29,42,.88),rgba(14,29,42,.18) 78%);z-index:-1}
#xd em{position:absolute;top:14px;left:24px;font:italic 400 72px/1 'Cormorant Garamond';color:#fff;opacity:.75;text-shadow:0 2px 10px #0006}
#xd h3,#xd p{color:#fff;text-shadow:0 1px 8px #0009}
#xd h3{font-size:34px;margin:6px 0}#xd p{margin:6px 0 0;font-size:16px;line-height:1.6}
#xd .tag{color:#e4edf4}
@media(max-width:760px){.fls{grid-template-columns:1fr}}
@media(max-width:640px){.xp{grid-template-columns:1fr}.tabs{gap:20px}}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font:500 24px 'Cormorant Garamond';list-style:none}summary::after{content:' +';color:var(--blue)}details[open] summary::after{content:' –'}details p{margin:10px 0 0;font-size:16px;color:var(--mute)}

.mo{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px;margin:34px 0 10px}
.mo>div{position:relative;background:var(--paper);padding:10px 10px 0;border:1px solid var(--line);box-shadow:0 12px 28px #1d2f4514;transition:transform .5s,box-shadow .5s}
.mo>div:nth-child(1){grid-column:span 2}.mo>div:nth-child(odd){transform:rotate(-1deg)}.mo>div:nth-child(even){transform:rotate(1.1deg)}
.mo>div:hover{transform:rotate(0) translateY(-6px);box-shadow:0 20px 40px #1d2f4524}
.mo>div::before{content:"";position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-3deg);background:#a9c1d6aa;filter:url(#wc);z-index:2}
.mo>div:nth-child(3n+2)::before{background:#9bb59aaa}.mo>div:nth-child(3n)::before{background:#e3c08fcc}
.mo b{display:block;height:300px;background:radial-gradient(ellipse at 30% 20%,var(--b2),var(--wash));overflow:hidden}
.mo b img{width:100%;height:100%;object-fit:cover;display:block}
.mo em{display:block;text-align:center;padding:12px 6px 15px;font:italic 400 23px 'Cormorant Garamond'}.mo em small{display:block;font:400 10px Jost;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);margin-top:2px}
@media(max-width:640px){.mo{grid-template-columns:1fr 1fr;gap:22px 14px}.mo b{height:190px}.mo em{font-size:19px}}

.c{text-align:center}.has span{display:none!important}
form{display:grid;gap:14px;max-width:520px;margin:0 auto}
fieldset{border:0;border-top:1px solid var(--line);padding:16px 0 0;margin:6px 0 0;display:grid;gap:12px}legend{font:italic 400 24px 'Cormorant Garamond';color:var(--blue);padding-right:12px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
footer{text-align:center;padding:60px 24px;color:var(--mute);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
#programa .tb{border-radius:50%;width:110px;height:110px;border:1px solid var(--line);background:var(--paper);font-size:48px}
#programa .tb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#programa .tb small{font-size:10px}
#mu{min-width:42px}
#pt{background:none;border:1px solid var(--blue);color:var(--blue);padding:5px 10px;font:inherit}
#en .lb{margin-bottom:22px}
#rsvp .status{font-size:14px;text-align:center;min-height:24px;color:var(--blue)}
@media(max-width:640px){nav{padding:10px 12px}nav div{gap:12px}.hero{min-height:88vh}#programa .tb{width:94px;height:94px}}
</style>
</head>

  <path d="M40 14a26 26 0 1 0 0 52c5 0 8-3 8-7 0-3-2-5-4-7-2-2-1-6 3-6h7
